    <meta
      name="description"
      content="ShiftPay là ứng dụng dành cho người quản lý đội ngũ nhân viên làm việc theo ca tại các sự kiện, giúp công việc điều hành rõ ràng và có tổ chức."
    />
    <link rel="canonical" href="https://at-shiftpay.web.app/" />
    <meta name="theme-color" content="#F2F4F0" />

    <!-- Apply the saved theme (or system preference) before first paint. -->
    <script>
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('theme');
          if (stored) {
            var parsed = JSON.parse(stored);
            var saved = parsed && parsed.state && parsed.state.theme;
            if (saved === 'light' || saved === 'dark' || saved === 'system') {
              preference = saved;
            }
          }
        } catch (error) {
          // Corrupted storage falls back to system.
        }
        var isDark =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#0C1210' : '#F2F4F0');
      })();
    </script>
